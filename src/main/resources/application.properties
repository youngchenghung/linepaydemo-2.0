spring.application.name=demo
spring.web.resources.static-locations=classpath:/static/
spring.mvc.view.prefix=/static/
spring.mvc.view.suffix=.html

domain.url=http://localhost:8080

# MyBatis 設置
mybatis.mapper-locations=classpath:mybatis/mapper/*.xml  # 如果使用 XML 配置
mybatis.type-aliases-package=linepaytest.LinePayDemo.Model  # 設置 model 類的路徑

# 設定 Logback 將日誌存入檔案
logging.file.name=logs/app.log
logging.level.root=info
logging.level.org.springframework=warn

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/linepaydemo_2_0?serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=11111111
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Google OAuth2 social login
spring.security.oauth2.client.registration.google.client-id={GOOGLE_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret={GOOGLE_OAUTH_CLIENT_SECRET}

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>商品分類頁面</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f8f8f8;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    #category-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .category-card {
      width: 250px;
      padding: 20px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .category-card:hover {
      transform: scale(1.03);
      background-color: #f0f0f0;
    }
    .category-title {
      font-size: 20px;
      font-weight: bold;
      color: #007bff;
    }
    .category-description {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

  <h1>商品分類</h1>
  <div id="category-list"></div>

  <script>
    // DOM 元素
    const categoryList = document.getElementById("category-list");

    // API 取得商品分類
    fetch("/api/product/categories")
      .then(res => res.json())
      .then(categories => {
        categories.forEach(category => {
          const card = document.createElement("div");
          card.className = "category-card";
          card.innerHTML = `
            <div class="category-title">${category.categoryName}</div>
            <div class="category-description">${category.description}</div>
          `;
          card.addEventListener("click", () => {
            window.location.href = `/category.html?categoryId=${category.categoryId}`;
          });
          categoryList.appendChild(card);
        });
      })
      .catch(err => {
        console.error("無法取得分類資料：", err);
        categoryList.innerHTML = "<p>載入分類失敗，請稍後再試。</p>";
      });
  </script>

</body>
</html>
